<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvoicePro — Register</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<div class="auth-shell"><div class="brand">Invoice<span>Pro</span></div>
<div class="auth-card"><h1>Create your account</h1><p class="muted">Start managing invoices in minutes.</p>
<form id="registerForm"><label>Full Name<input id="fullName" required></label>
<label>Business Name<input id="businessName" required></label><label>Email<input id="email" type="email" required></label>
<label>Password<input id="password" type="password" minlength="8" required></label>
<button class="btn primary full" type="submit">Create account</button></form>
<p id="authMsg" class="msg"></p><p class="switch">Already have an account? <a href="login.html">Sign in</a></p></div></div>
<script type="module" src="js/auth.js"></script></body></html>
