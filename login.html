<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvoicePro — Login</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<div class="auth-shell"><div class="brand">Invoice<span>Pro</span></div>
<div class="auth-card"><h1>Welcome back</h1><p class="muted">Sign in to manage your invoices.</p>
<form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label>
<label>Password<input id="password" type="password" required autocomplete="current-password"></label>
<label class="check"><input id="remember" type="checkbox" checked> Remember this session</label>
<button class="btn primary full" type="submit">Sign in</button></form>
<button class="link-btn" id="forgotBtn">Forgot password?</button><p id="authMsg" class="msg"></p>
<p class="switch">New to InvoicePro? <a href="register.html">Create an account</a></p></div></div>
<script type="module" src="js/auth.js"></script></body></html>
